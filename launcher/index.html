<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Pretzel Client — Launchpad</title>
	<link rel="icon" href="/pretzel-logo.png">
	<link rel="stylesheet" href="/launcher/launcher.css?v=20261106b">
	<link rel="stylesheet" href="/launcher/mods.css?v=20261107a">
</head>
<body>
	<div class="app">
		<nav class="rail" id="rail" aria-label="Sections"></nav>
		<div class="shell">
			<header class="topbar">
				<div class="crumbs" id="crumbs">
					<img class="crumb-logo" src="/pretzel-logo.png" alt="">
					<span class="crumb-name">Pretzel Client</span>
					<span class="pill mono" id="versionPill">1.21.11 &middot; Modded</span>
				</div>
				<div class="top-actions">
					<div class="mx-dl-wrap">
						<button class="icon-btn mx-dl-btn" id="mxDownloadsBtn" data-mx="downloads" title="Downloads" aria-label="Downloads">
							<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
								<path d="M12 3v12m0 0 4-4m-4 4-4-4"></path><path d="M4 20h16"></path>
							</svg>
							<span class="mx-dl-badge" id="mxDownloadBadge" hidden>0</span>
						</button>
						<div class="mx-dl-pop" id="mxDownloadsPop" hidden></div>
					</div>
					<span class="pill ghost mono mx-instances">0 Instances Running</span>
					<button class="pill ghost mono" id="clientState" title="Client build status">
						<span class="dot"></span><span id="clientStateText">checking client&hellip;</span>
					</button>
					<button class="account" id="accountChip">
						<span class="avatar" id="accountAvatar">?</span>
						<span class="account-text" id="accountText">Click to Login</span>
					</button>
					<button class="icon-btn plus" id="premiumBtn" title="Pretzel Premium">+</button>
				</div>
			</header>
			<main class="view" id="view" tabindex="-1"></main>
		</div>
	</div>
	<div class="toast-stack" id="toasts" aria-live="polite"></div>
	<div id="modal-root"></div>
	<input type="file" id="skinFile" data-file="skin" accept="image/png" hidden>
	<input type="file" id="bannerFile" data-file="banner" accept="image/png,image/jpeg" hidden>
	<script src="/launcher/account-api.js?v=20261106d"></script>
	<script src="/launcher/servers-data.js?v=20261106b"></script>
	<script src="/launcher/mods.js?v=20261107b"></script>
	<script src="/launcher/launcher.js?v=20261106d"></script>
</body>
</html>
