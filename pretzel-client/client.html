<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pretzel Client — Modded Build</title>
<style>
html, body { margin: 0; padding: 0; height: 100%; background: #07070b; color: #e8e8ee; overflow: hidden; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
#gameCanvas { display: none; width: 100vw; height: 100vh; }
body.playing #gameCanvas { display: block; }
body.playing #boot { display: none; }
#boot { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; box-sizing: border-box;
  background: radial-gradient(60% 50% at 50% 38%, rgba(255,255,255,.055), transparent 70%), #07070b; }
#logo { width: clamp(120px, 18vw, 190px); height: auto; opacity: .95; filter: drop-shadow(0 0 26px rgba(255,255,255,.12)); }
.wordmark { display: flex; flex-direction: column; align-items: center; gap: 2px; line-height: 1; letter-spacing: .14em; text-transform: uppercase; }
.wordmark .l1 { font-size: clamp(26px, 4.4vw, 44px); font-weight: 800; color: #fff; text-shadow: 0 3px 0 #3b2a12, 0 0 22px rgba(255,190,90,.28); }
.wordmark .l2 { font-size: clamp(16px, 2.3vw, 24px); font-weight: 700; letter-spacing: .42em; color: #f0b45a; text-shadow: 0 2px 0 #2a1c08; }
#status { display: flex; align-items: center; gap: 9px; font-size: 15px; letter-spacing: .04em; min-height: 20px; color: #e8c46a; }
#status .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 10px currentColor; animation: pulse 1.3s ease-in-out infinite; }
#status.is-ready { color: #4fdc82; } #status.is-ready .dot { animation: none; }
#status.is-offline { color: #ff5a5a; } #status.is-offline .dot { animation: none; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .28; } }
.bar { position: relative; width: min(560px, 74vw); height: 7px; border-radius: 4px; background: #171a1d; box-shadow: inset 0 1px 2px rgba(0,0,0,.7); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0%; border-radius: 4px; background: linear-gradient(90deg, #1e9e58, #4fdc82 65%, #9ff7bd); box-shadow: 0 0 14px rgba(79,220,130,.55); transition: width .18s linear; }
.barrow { width: min(560px, 74vw); display: flex; align-items: center; justify-content: space-between; gap: 14px; font-size: 11.5px; letter-spacing: .08em; color: #6f7a73; text-transform: uppercase; }
#pct { color: #6fe09b; font-variant-numeric: tabular-nums; }
#phase { min-height: 34px; font-size: 12.5px; color: #8b93a0; text-align: center; max-width: 72ch; line-height: 1.55; }
#phase b { color: #c9d1da; font-weight: 600; }
#retry { display: none; margin-top: 2px; padding: 8px 18px; border: 1px solid #3a3f46; border-radius: 6px; background: #14161a; color: #d7dde4; font: inherit; font-size: 12.5px; letter-spacing: .06em; cursor: pointer; }
#retry:hover { border-color: #4fdc82; color: #9ff7bd; }
#tip { position: fixed; left: 0; right: 0; bottom: 22px; text-align: center; font-size: 12.5px; color: #6a6a78; padding: 0 24px; }
#tip b { color: #c9a15a; font-weight: 600; }
</style>
</head>
<body>
<div id="boot">
  <img id="logo" src="/pretzel-logo.png?v=20261105a" alt="Pretzel Client">
  <div class="wordmark"><span class="l1">Pretzel</span><span class="l2">Client</span></div>
  <div id="status"><span class="dot"></span><span id="statusText">Loading modded client…</span></div>
  <div class="bar"><i id="fill"></i></div>
  <div class="barrow"><span id="phaseLabel">Modded client</span><span id="pct">0%</span></div>
  <div id="phase">The launcher now boots the modded client. The vanilla prebuilt is not used.</div>
  <button id="retry" type="button">Retry</button>
</div>
<canvas id="gameCanvas" width="1280" height="720"></canvas>
<script src="client-loader.js?v=20261105b"></script>
</body>
</html>
